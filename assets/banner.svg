<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes flowScan {
      0% { transform: translateX(-1200px); }
      100% { transform: translateX(1200px); }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    @keyframes orbRotate {
      0% { transform: rotate(0deg) translate(30px) rotate(0deg); }
      100% { transform: rotate(360deg) translate(30px) rotate(-360deg); }
    }
    .ambient-glow {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .scanner-line {
      animation: flowScan 4s linear infinite;
    }
    .pill-1 { animation: floatPill1 4.5s ease-in-out infinite; }
    .pill-2 { animation: floatPill2 5.2s ease-in-out infinite; }
    .pill-3 { animation: floatPill1 6s ease-in-out infinite 0.8s; }
    .pill-4 { animation: floatPill2 4.8s ease-in-out infinite 1.2s; }
    .orbiting-orb { animation: orbRotate 12s linear infinite; }
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.025em;
    }
    .sub-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
    }
    .mono-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Geometric Grid Pattern (Subtle Identity Grid) -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" stroke-dasharray="4 8" />
    <line x1="0" y1="140" x2="1200" y2="140" stroke-dasharray="4 8" />
    <line x1="0" y1="210" x2="1200" y2="210" stroke-dasharray="4 8" />
    <line x1="0" y1="280" x2="1200" y2="280" stroke-dasharray="4 8" />
    <line x1="0" y1="350" x2="1200" y2="350" stroke-dasharray="4 8" />
    <line x1="150" y1="0" x2="150" y2="420" stroke-dasharray="4 8" />
    <line x1="300" y1="0" x2="300" y2="420" stroke-dasharray="4 8" />
    <line x1="450" y1="0" x2="450" y2="420" stroke-dasharray="4 8" />
    <line x1="600" y1="0" x2="600" y2="420" stroke-dasharray="4 8" />
    <line x1="750" y1="0" x2="750" y2="420" stroke-dasharray="4 8" />
    <line x1="900" y1="0" x2="900" y2="420" stroke-dasharray="4 8" />
    <line x1="1050" y1="0" x2="1050" y2="420" stroke-dasharray="4 8" />
  </g>

  <!-- Ambient Dynamic Glowing Orbs (in Background Behind Text) -->
  <circle cx="200" cy="110" r="140" fill="#38bdf8" opacity="0.22" filter="url(#glowPurple)" class="ambient-glow" />
  <circle cx="1020" cy="280" r="160" fill="#818cf8" opacity="0.2" filter="url(#glowPurple)" class="ambient-glow" style="animation-delay: -3s;" />
  <circle cx="620" cy="220" r="100" fill="#c084fc" opacity="0.14" filter="url(#glowPurple)" class="orbiting-orb" />

  <!-- Animated Laser Beam Scanner in Background -->
  <g opacity="0.7">
    <rect x="0" y="210" width="1200" height="2" fill="url(#cyanLine)" class="scanner-line" />
  </g>

  <!-- Interactive Dynamic Floating Security Pillars / Architecture Elements -->
  <g class="pill-1" filter="url(#cardShadow)">
    <rect x="70" y="50" width="170" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="92" cy="69" r="5" fill="#38bdf8" />
    <text x="108" y="74" fill="#e2e8f0" font-size="13" class="mono-text" font-weight="600">SSO &amp; SAML 2.0</text>
  </g>

  <g class="pill-2" filter="url(#cardShadow)">
    <rect x="960" y="55" width="170" height="38" rx="19" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="982" cy="74" r="5" fill="#818cf8" />
    <text x="998" y="79" fill="#e2e8f0" font-size="13" class="mono-text" font-weight="600">OIDC &amp; OAuth 2.0</text>
  </g>

  <g class="pill-3" filter="url(#cardShadow)">
    <rect x="80" y="335" width="180" height="38" rx="19" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" opacity="0.9" />
    <circle cx="102" cy="354" r="5" fill="#c084fc" />
    <text x="118" y="359" fill="#e2e8f0" font-size="13" class="mono-text" font-weight="600">MFA &amp; Passkeys</text>
  </g>

  <g class="pill-4" filter="url(#cardShadow)">
    <rect x="945" y="330" width="195" height="38" rx="19" fill="#1e293b" stroke="#34d399" stroke-width="1.2" opacity="0.9" />
    <circle cx="967" cy="349" r="5" fill="#34d399" />
    <text x="983" y="354" fill="#e2e8f0" font-size="13" class="mono-text" font-weight="600">Zanzibar &amp; ReBAC</text>
  </g>

  <!-- Foreground Shield / Key Icon Badge -->
  <g transform="translate(565, 52)" filter="url(#cardShadow)">
    <rect x="-35" y="-6" width="70" height="70" rx="20" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M0 8 L18 16 V27 C18 38 10 47 0 51 C-10 47 -18 38 -18 27 V16 Z" fill="none" stroke="url(#textGrad)" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="0" cy="25" r="3" fill="#38bdf8" />
    <path d="M0 28 V35" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- FOREGROUND TEXT - Clean, Crisp, Never Obstructed -->
  <!-- Category Pill -->
  <g transform="translate(600, 150)">
    <rect x="-175" y="-14" width="350" height="28" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="0" y="4" text-anchor="middle" fill="#94a3b8" font-size="12" class="mono-text" font-weight="600" letter-spacing="0.08em">
      CLOUD IDENTITY &amp; IAM DIRECTORY
    </text>
  </g>

  <!-- Main Headline Title -->
  <text x="600" y="210" text-anchor="middle" fill="url(#textGrad)" font-size="44" class="title-text" filter="url(#cardShadow)">
    Awesome Cloud Identity &amp; Auth
  </text>

  <!-- Subtitle -->
  <text x="600" y="252" text-anchor="middle" fill="#f8fafc" font-size="20" class="sub-text">
    Curated SaaS Platforms, CIAM Ecosystems &amp; Open-Source Identity Providers
  </text>

  <!-- Tagline Feature Bullets -->
  <text x="600" y="286" text-anchor="middle" fill="#94a3b8" font-size="14" class="sub-text">
    Single Sign-On (SSO) • Multi-Factor Authentication (MFA) • OAuth2/OIDC • Zero Trust • Fine-Grained Authorization
  </text>

  <!-- Bottom Border Highlight -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#textGrad)" />
</svg>
